# Model
base_model: model/mistral-small-4-119b-2603-bf16-local
trust_remote_code: false

# Dataset and MistraL template
chat_template: tokenizer_default
chat_template_kwargs:
  reasoning_effort: "none"

datasets:
  - path: data/processed/phase-f-source-decision-v1/train.jsonl
    ds_type: json
    split: train
    type: chat_template
    field_messages: messages
    message_property_mappings:
      role: role
      content: content
    roles_to_train:
      - assistant
    train_on_eos: turn

val_set_size: 0.0

dataset_prepared_path: artifact/mistral-small-4-119b/prepared/g1-qlora-ddp-20260818-001
output_dir: artifact/mistral-small-4-119b/runs/g1-qlora-ddp-20260818-002

# Sequence construction
sequence_len: 2048
sample_packing: false
eval_sample_packing: false
pad_to_sequence_len: false
train_on_inputs: false

# QLoRA
adapter: qlora
load_in_4bit: true
load_in_8bit: false
quantize_moe_experts: true

bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true
bnb_4bit_compute_dtype: bfloat16

lora_r: 16
lora_alpha: 32
lora_dropout: 0.0

# Text attention only; avoids vision_tower modules with similar names.
lora_target_modules:
  - self_attn.q_a_proj
  - self_attn.q_b_proj
  - self_attn.kv_a_proj_with_mqa
  - self_attn.kv_b_proj
  - self_attn.o_proj
  - mlp.shared_experts.gate_proj
  - mlp.shared_experts.up_proj
  - mlp.shared_experts.down_proj

# Fused MoE expert weights are nn.Parameter, not nn.Linear
lora_target_parameters:
  - mlp.experts.gate_up_proj
  - mlp.experts.down_proj

# One-step G1 canary
max_steps: 1
num_epochs: 1
micro_batch_size: 1
gradient_accumulation_steps: 1
eval_batch_size: 1

learning_rate: 0.0001
optimizer: adamw_bnb_8bit
lr_scheduler: constant
warmup_steps: 0
weight_decay: 0.0
max_grad_norm: 1.0

# Runtime
bf16: true
fp16: false
tf32: true
flash_attention: true
gradient_checkpointing: true

# Reproducibility
seed: 20260728
data_seed: 20260728

# Logging and adapter save
logging_steps: 1
save_strategy: steps
save_steps: 1
save_total_limit: 1
save_safetensors: true
