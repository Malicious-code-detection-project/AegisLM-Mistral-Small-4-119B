[project]
name = "aegislm-mistral-small-4-119b"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.3"
dependencies = [
    "axolotl[flash-attn]==0.17.0",
    "bitsandbytes==0.49.1",
    "cut-cross-entropy",
    "flash-attn==2.8.3",
    "ninja>=1.13.0",
    "packaging==26.0",
    "psutil>=7.2.2",
    "setuptools>=64",
    "setuptools-scm>=8",
    "torch==2.12.1",
    "torchao==0.17.0",
    "torchvision==0.27.1",
    "transformers==5.9.0",
    "wheel>=0.47.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
cut-cross-entropy = { git = "https://github.com/axolotl-ai-cloud/ml-cross-entropy.git", rev = "5f0c7a7778b5b17d37738fae10065ed3034373af" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv]
package = false
no-build-isolation-package = ["flash-attn"]

[tool.uv.extra-build-dependencies]
axolotl = ["torch==2.12.1"]
flash-attn = [
    { requirement = "torch", match-runtime = true },
    "packaging",
    "setuptools",
    "wheel",
    "ninja",
    "psutil",
]

[tool.uv.extra-build-variables]
flash-attn = { FLASH_ATTN_CUDA_ARCHS = "100", MAX_JOBS = "4", NVCC_THREADS = "1" }

[dependency-groups]
dev = [
    "gpustat>=1.1.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
